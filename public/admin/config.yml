# Sveltia CMS configuration.
#
# The `backend` block below is enough to test the admin form LOCALLY against
# your own working copy of this repo — no GitHub login needed for that, see
# "Testing the admin locally" in README.md. It is NOT yet enough to let the
# owner log in and publish from the live site: that needs the `base_url`
# (an OAuth Worker) filled in, which is the "Next step: connect the CMS"
# section of the README.
backend:
  name: github
  repo: ludosaas/artgallery
  branch: main
  base_url: https://artwork.ludovic-saas.workers.dev

media_folder: "public/images/artworks"
public_folder: "/images/artworks"

collections:
  - name: "artworks"
    label: "Artworks"
    folder: "src/content/artworks"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Year", name: "year", widget: "string" }
      - { label: "Medium", name: "medium", widget: "string" }
      - { label: "Dimensions", name: "dimensions", widget: "string", required: false }
      - { label: "Price / availability", name: "price", widget: "string", required: false, hint: "e.g. '€450', 'Sold', or 'Inquire'" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Image alt text", name: "imageAlt", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Featured on homepage", name: "featured", widget: "boolean", default: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Sort order", name: "order", widget: "number", required: false }
      - { label: "Body (optional, not shown on site)", name: "body", widget: "markdown", required: false }
